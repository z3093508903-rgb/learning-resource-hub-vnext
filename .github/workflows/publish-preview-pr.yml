name: Preview Release Runner

on:
  pull_request:
    branches:
      - preview-release-runner

permissions:
  contents: read

jobs:
  publish-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/go-study-0.3.0-beta.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PREVIEW_VERSION: 0.3.0-beta.1
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.1
    steps:
      - name: Checkout preview head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source and build
        run: npm run release:check

      - name: Package isolated preview plugin
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Isolated Go Study preview build for Windows acceptance testing.';
          fs.writeFileSync(path.join(out, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error(`Expected workbench view type not found: ${oldView}`);
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.1

          This is an isolated Windows acceptance build.

          - Plugin ID: `go-study-preview`
          - Workbench view ID: `go-study-preview-workbench`
          - Data is stored separately from `learning-resource-hub-next`.
          - Permanent learning backlinks intentionally remain `obsidian://go-study?...` so this preview tests the future public backlink contract.

          ## Install

          Extract the `go-study-preview` folder into your Vault's `.obsidian/plugins/` directory, then enable **Go Study Preview** in Community plugins.

          ## First checks

          1. Confirm your existing Learning Resource Hub Next can remain enabled.
          2. Open **Go Study Preview** and create/import a small disposable test project.
          3. Test local video, Bilibili, OpenList, Vault files, Anki, restart persistence, and backup restore.
          4. For learning-position/capture tests, use the Go Study Bridge v1 helper build from `z3093508903-rgb/markdown2potplayer` PR #2 and close the old markdown2potplayer helper first to avoid the legacy port 33660 conflict.
          5. Run command **检查 PotPlayer Bridge** before position/capture tests.
          6. Launch a video from Go Study Preview, run **插入当前学习位置**, then click the inserted backlink.
          7. Run **截图并插入当前学习位置** and confirm the PNG is created under `GoStudy/Captures/`.

          Do not use important production data for this beta.
          EOF

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const manifestPath = path.join('dist-preview', 'go-study-preview', 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.id !== process.env.PREVIEW_ID) throw new Error('Preview plugin ID isolation failed.');
          if (manifest.name !== process.env.PREVIEW_NAME) throw new Error('Preview plugin name mismatch.');
          if (manifest.version !== process.env.PREVIEW_VERSION) throw new Error('Preview version mismatch.');
          const bundle = fs.readFileSync(path.join('dist-preview', 'go-study-preview', 'main.js'), 'utf8');
          if (!bundle.includes('go-study-preview-workbench')) throw new Error('Preview workbench view ID was not isolated.');
          if (bundle.includes('learning-resource-hub-next-workbench')) throw new Error('Original workbench view ID leaked into preview bundle.');
          NODE

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

      - name: Publish or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          Windows acceptance build for Resource ↔ Position ↔ Note backlinks.

          Isolated from the currently installed `learning-resource-hub-next` plugin:
          - plugin id: `go-study-preview`
          - workbench view id: `go-study-preview-workbench`
          - separate Obsidian plugin data directory

          Includes durable Go Study backlinks, resume writes, active-media mismatch protection, screenshot-to-Vault insertion, OpenList relink/remap, and the authenticated loopback PotPlayer Bridge client.

          For Bridge-dependent tests, use markdown2potplayer PR #2 (`feature/go-study-bridge-v1`) and stop the old helper first because both retain the legacy 33660 compatibility endpoint.
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
              "dist-preview/go-study-preview/main.js" \
              "dist-preview/go-study-preview/manifest.json" \
              "dist-preview/go-study-preview/styles.css" \
              "dist-preview/go-study-preview/TESTING.md" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "Go Study Preview ${PREVIEW_VERSION}" \
              --notes "$NOTES" \
              --prerelease \
              "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
              "dist-preview/go-study-preview/main.js" \
              "dist-preview/go-study-preview/manifest.json" \
              "dist-preview/go-study-preview/styles.css" \
              "dist-preview/go-study-preview/TESTING.md"
          fi

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,name,isPrerelease,url,assets
