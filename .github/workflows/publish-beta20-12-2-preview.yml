name: Publish Beta20.12.2 HUD Direction Race Preview

on:
  push:
    branches:
      - fix/hud-direction-race-beta20-12-2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.12.2
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.12.2
      BRIDGE_VERSION: 0.1.1
    steps:
      - uses: actions/checkout@v4

      - name: Package preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta20.12.2: deterministic HUD direction selection to prevent browser key leakage.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          if (!bundle.includes('revealHudNow')) throw new Error('Missing HUD race fix marker.');
          if (bundle.includes('if (!visible) return execute(slot)')) throw new Error('Old pre-visible immediate execution still present.');
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.12.2

          ## HUD direction race regression
          1. Keep Bilibili in Chrome/Edge as the active video tab.
          2. Keep Companion always-on-top if desired.
          3. Press Alt+S.
          4. Immediately press Up twice, faster than the configured HUD delay.
          5. Expected:
             - first Up only selects Up and forces the HUD visible;
             - second Up executes Up;
             - neither Up is allowed to leak into Chrome/Edge.
          6. Repeat with Left / Right / Down.
          7. Repeat slowly after the HUD is already visible.
          8. Fast and slow gestures must behave identically.

          ## Enter path
          Alt+S -> one direction -> Enter must execute the selected slot.

          ## Browser safety
          Browser menus/settings/history must not react to the direction keys while a Go Study HUD session is active.

          ## Existing Bilibili bridge
          Bilibili Bridge 0.1.1 remains compatible and is included unchanged for convenience.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

          cd browser-extension
          zip -qr "../dist-preview/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" bilibili-bridge
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.12.2 fixes a timing race in the HUD gesture. Previously, a direction pressed before the delayed HUD became visible executed immediately, so a user's second direction press could leak into Chrome/Edge. Direction semantics are now deterministic: first press always selects and reveals the HUD; second same-direction press or Enter executes. Full validation: 406/406 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-12-2-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-12-2-preview.yml
          git commit -m "ci: remove one-shot beta20.12.2 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
