name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and build release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_STRICT: '1'
        run: npm run release:check:strict

      - name: Package plugin and Bilibili bridge
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/go-study
          cp main.js manifest.json styles.css dist/go-study/
          (cd dist && zip -qr "go-study-${GITHUB_REF_NAME}.zip" go-study)
          (cd browser-extension && zip -qr "../dist/go-study-bilibili-bridge.zip" bilibili-bridge)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME"             main.js manifest.json styles.css             "dist/go-study-${GITHUB_REF_NAME}.zip"             "dist/go-study-bilibili-bridge.zip"             --title "Go Study $GITHUB_REF_NAME"             --notes-file docs/RELEASE_NOTES_0.3.0.md
