name: Publish Beta20.5 Preview

on:
  push:
    branches:
      - fix/timeline-note-navigation-beta20-5

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.5
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check
      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.5: note-local Timeline Navigator.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'navigateTimelineItem',
            '点击定位到笔记',
            'clearTimelinesExcept',
            'goStudyTimelineSignature'
          ]) if (!packed.includes(marker)) throw new Error('Missing beta20.5 marker: ' + marker);
          if (packed.includes('Ctrl 点击网页')) throw new Error('Old timeline browser hint still present.');
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.5

          Product-logic correction for Timeline Navigator.

          ## Expected behavior
          1. Timeline only appears while the active Markdown note itself contains Go Study timestamps.
          2. Switch to a normal Markdown note without Go Study timestamps:
             Timeline disappears.
          3. Switch to Go Study workbench / Settings / another non-Markdown page:
             Timeline disappears.
          4. Click a timestamp in the Timeline:
             It scrolls to the corresponding line in the current note and briefly highlights the target.
          5. Timeline click does NOT launch PotPlayer or browser.
          6. To play the source video, click the actual “回到课程” backlink after locating the knowledge point.
          7. Hover stability from beta20.4 must remain intact.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.5: Timeline Navigator is now note navigation only, scoped to the active relevant Markdown note, with local line jump and stale-overlay cleanup. 337/337 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-5-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-5-preview.yml
          git commit -m "ci: remove one-shot beta20.5 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
