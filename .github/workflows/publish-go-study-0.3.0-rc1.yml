name: Publish Go Study 0.3.0 RC1

on:
  push:
    branches:
      - release/go-study-0.3.0-rc1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RC_VERSION: 0.3.0-rc.1
      RC_ID: go-study-preview
      RC_NAME: Go Study RC
      RELEASE_TAG: go-study-rc-v0.3.0-rc.1
      BRIDGE_VERSION: 0.1.1
    steps:
      - uses: actions/checkout@v4

      - name: Package RC
        shell: bash
        run: |
          rm -rf dist-rc
          mkdir -p dist-rc/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-rc', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.RC_ID;
          manifest.name = process.env.RC_NAME;
          manifest.version = process.env.RC_VERSION;
          manifest.description = 'Go Study 0.3.0 RC1: release-candidate build for final Windows acceptance.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          for (const marker of [
            'registerGoStudyReferenceProtocol',
            'legacyGoStudyProtocolConflict',
            'shouldUseFocusedWebHud',
            'applyStrongCompanionTopmost',
            'requestBilibiliWebBridge'
          ]) if (!bundle.includes(marker)) throw new Error('Missing RC marker: ' + marker);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-rc/go-study-preview/TESTING.md <<'EOF'
          # Go Study 0.3.0 RC1 — Final Manual Acceptance

          This RC intentionally keeps plugin id "go-study-preview" so existing Preview test data remains in place.

          ## A. Cold start + restart persistence
          1. Record current project/resource counts and one visible setting/layout.
          2. Fully close Obsidian.
          3. Reopen and verify the data.
          4. Fully close/reopen a second time.
          5. Expected: no project/resource loss, settings/layout persist, no abnormal empty-state warning.

          ## B. Named backup + restore
          1. Settings -> Data -> create a named backup "RC1-before-restore".
          2. Make one obvious reversible state change (for example rename a throwaway project).
          3. Restore the named backup.
          4. Expected: state returns to pre-change value.
          5. Verify the named backup still exists and was not pruned.

          ## C. Core player paths
          - Resource Center local video -> PotPlayer.
          - Bilibili managed/freeform -> correct destination and timestamp.
          - OpenList video -> login/auth + PotPlayer playback/seek.
          - Ctrl-click Bilibili backlink -> browser.
          - Legacy JV switch ON -> old JV link still opens without old helper.

          ## D. Companion / HUD
          - Native file-tree Markdown drag -> Companion.
          - Project Note Box note drag -> Companion.
          - PotPlayer absent -> standalone Companion works.
          - Companion pin stays above Chrome/Edge.
          - Bilibili web + Companion -> Alt+S HUD.
          - HUD directions/Enter/Esc do not leak to browser.
          - Quick Note input appears above browser/Companion.
          - Long-note typing has no repeated caret jitter.

          ## E. Timeline
          - Relevant mixed-video note -> one collapsed dot per source.
          - Hover stable.
          - Timeline click navigates to note line, not video.
          - Switch to unrelated note/workbench/settings -> old overlay disappears.

          ## F. Recovery / references
          - Managed v3 fallback remains readable if current Resource state is absent.
          - One legacy v1 link can recover/relink.
          - Vault note/folder rename/delete/recreate updates references.

          ## G. Light mode
          Switch Obsidian to light theme and open the major Go Study modals/settings.
          Expected: readable text, backgrounds, borders and buttons; no dark-only invisible controls.

          ## H. Legacy plugin coexistence
          If old "Learning Resource Hub Next" is still installed:
          1. Enable it together with this RC once.
          2. Reload Obsidian.
          3. Expected: Go Study itself still starts and shows a warning to disable the old plugin.
          4. Disable the old plugin and reload before normal use.

          ## Publish blocker
          Any data loss, wrong capture target, wrong media/timestamp, backup overwrite, stuck global overlay,
          broken Markdown caret, or plugin startup failure = HOLD.
          EOF

          cd dist-rc
          zip -qr "go-study-0.3.0-rc.1.zip" go-study-preview
          cd ..

          cd browser-extension
          zip -qr "../dist-rc/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" bilibili-bridge
          cd ..

      - name: Publish RC prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study 0.3.0 RC1" \
            --notes "Release candidate after beta20.12.3 acceptance. Adds fail-safe legacy protocol coexistence handling; otherwise feature-frozen. Full automated validation: 412/412 tests passing. Stable publish remains HOLD until final Windows/OpenList/restart/backup/reference regression and permanent plugin identity are confirmed." \
            --prerelease \
            "dist-rc/go-study-0.3.0-rc.1.zip" \
            "dist-rc/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" \
            "dist-rc/go-study-preview/main.js" \
            "dist-rc/go-study-preview/manifest.json" \
            "dist-rc/go-study-preview/styles.css" \
            "dist-rc/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-go-study-0.3.0-rc1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-go-study-0.3.0-rc1.yml
          git commit -m "ci: remove one-shot Go Study 0.3.0 RC1 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
