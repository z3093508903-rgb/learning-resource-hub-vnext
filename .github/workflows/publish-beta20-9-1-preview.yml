name: Publish Beta20.9.1 Preview

on:
  push:
    branches:
      - fix/freeform-bili-ctrlclick-beta20-9-1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.9.1
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.9.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check
      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.9.1: Bilibili Ctrl-click / Companion link hotfix.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'markdownSafeReferenceUri',
            'referenceDocuments',
            'makeReferenceClickHandler',
            '_goStudyBrowserModifier'
          ]) if (!packed.includes(marker)) throw new Error('Missing beta20.9.1 marker: ' + marker);
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.9.1

          Focus: PotPlayer-opened Bilibili Freeform timestamp Ctrl-click.

          1. Open a Bilibili video in PotPlayer.
          2. Capture a Go Study timestamp.
          3. Verify the visible note still shows only the time.
          4. Ctrl-click the timestamp in the normal Obsidian Markdown window.
          5. Expected: browser opens the Bilibili /video/BV... page with t=<captured seconds>.
          6. Repeat inside the Go Study Companion popout window.
          7. Expected: same browser behavior.
          8. Newly generated URI should encode nested HTTP host dots, e.g. www%2Ebilibili%2Ecom, so Obsidian does not auto-link the host inside obsidian://go-study.
          9. PotPlayer titles containing replacement characters (�) should not be preserved as the timeline source title; Go Study falls back to portable BVID/name metadata.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "Hotfix for PotPlayer-opened Bilibili Freeform timestamps: Markdown-safe nested web query values, Ctrl/Meta-click handler across main and Companion documents, Bilibili t=seconds jump, and mojibake title fallback. 372/372 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-9-1-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-9-1-preview.yml
          git commit -m "ci: remove one-shot beta20.9.1 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
