name: Publish Beta20.12.3 Focused Web HUD Preview

on:
  push:
    branches:
      - fix/web-hud-focus-beta20-12-3

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.12.3
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.12.3
      BRIDGE_VERSION: 0.1.1
    steps:
      - uses: actions/checkout@v4

      - name: Package preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta20.12.3: focused Bilibili HUD input + stronger note/Companion topmost behavior.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          for (const marker of [
            'shouldUseFocusedWebHud',
            'before-input-event',
            'screen-saver',
            'applyStrongCompanionTopmost'
          ]) if (!bundle.includes(marker)) throw new Error('Missing beta20.12.3 marker: ' + marker);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.12.3

          ## Bilibili aggressive HUD mode
          1. Keep Bilibili as the active browser tab.
          2. Keep Companion topmost or click the browser itself.
          3. Press Alt+S.
          4. Expected: the HUD appears immediately and takes keyboard focus.
          5. Arrow keys / Enter / Esc must be handled inside the HUD window.
          6. Browser menus/settings/history must not react to those keys.
          7. Select a note action, execute it, and verify the Quick Note input appears above Chrome/Edge.

          ## Bootstrap race
          Press Alt+S and an arrow extremely quickly.
          Expected: a temporary global-key safety net catches the key until the HUD has focus, then releases it.

          ## Companion topmost
          1. Open Companion and pin it.
          2. Click Chrome/Edge and continue using Bilibili.
          3. Expected: Companion stays above the browser.
          4. The Quick Note input must still appear above Companion when a note action opens.

          ## PotPlayer regression
          Focus PotPlayer, then Alt+S.
          Expected: PotPlayer mode keeps the existing non-focusable HUD behavior and does not lose foreground eligibility.

          Bilibili Bridge 0.1.1 is unchanged and included for convenience.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

          cd browser-extension
          zip -qr "../dist-preview/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" bilibili-bridge
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.12.3 replaces browser-front HUD direction handling with a focused local Electron HUD. A short-lived global-key bootstrap safety net covers the focus handoff, then arrow/Enter/Escape input is consumed locally so Chrome/Edge cannot steal it. Quick Note and Companion also use a stronger screen-saver topmost level. PotPlayer keeps its existing non-focusable HUD path. Full validation: 409/409 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-12-3-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-12-3-preview.yml
          git commit -m "ci: remove one-shot beta20.12.3 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
