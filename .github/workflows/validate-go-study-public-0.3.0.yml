name: Validate Go Study Public 0.3.0

on:
  push:
    branches:
      - release/go-study-0.3.0-public

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: 0.3.0
          RELEASE_STRICT: '1'
        run: npm run release:check:strict
      - name: Commit generated bundle and remove one-shot validator
        shell: bash
        run: |
          rm .github/workflows/validate-go-study-public-0.3.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/validate-go-study-public-0.3.0.yml
          git commit -m "build: validate Go Study public 0.3.0"
          git push origin HEAD:${GITHUB_REF_NAME}
