name: Sync generated main.js

on:
  push:
    branches:
      - release-hardening

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release-hardening

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build plugin
        run: npm run build

      - name: Commit generated bundle if needed
        run: |
          if git diff --quiet -- main.js; then
            echo "main.js is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "build: sync generated main.js"
          git push origin HEAD:release-hardening
