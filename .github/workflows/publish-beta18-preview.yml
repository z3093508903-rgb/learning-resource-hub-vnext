name: Publish Beta18 Preview

on:
  push:
    branches:
      - work/companion-note-beta18

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.18
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check

      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.18: Companion Note Window and beta.17 interaction polish.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'go-study-preview-workbench',
            'open-current-note-in-companion-window',
            'restore-companion-note-window',
            "getLeaf('window')",
            'go-study-companion-window',
            'directionDoublePressMs',
            'quickNoteWindowGeometry',
            'go-study-template-card',
            '回到课程'
          ]) {
            if (!packed.includes(marker)) throw new Error('Missing beta.18 marker: ' + marker);
          }
          if (packed.includes(oldView)) throw new Error('Preview view isolation failed.');
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.18

          Companion Note Window + beta.17 polish acceptance build.

          ## Install / upgrade
          1. Keep your existing data.json.
          2. Replace main.js, manifest.json, styles.css in:
             .obsidian/plugins/go-study-preview/
          3. Reload Obsidian.
          4. Confirm Community plugins shows Go Study Preview 0.3.0-beta.18.

          ## A. beta.17 polish
          ### HUD double direction
          - Alt+S -> direction -> Enter must still work.
          - When HUD is visible, pressing the same direction twice quickly should execute that slot once.
          - It must never write the capture twice.

          ### Quick-note popup
          - Header can be dragged.
          - Default vertical position should be lower than before.
          - Move it, save/cancel a note, trigger it again: position should restore.
          - Textarea scrollbar should be visually subtle.

          ### Freeform visible title
          - New unmatched video backlink should display:
            ↗ 回到课程 · time
          - PotPlayer/Bridge garbage title must not appear.

          ### Settings
          - HUD mappings should appear as one compact map instead of many large cards.
          - Each Markdown template should have its editor beside a live rendered preview.
          - Typing should refresh the preview immediately.
          - Raw Markdown should be behind “查看最终 Markdown”.

          ## B. Companion Note Window
          1. Open a real editable Markdown note.
          2. Settings -> Go Study -> 学习笔记小窗 -> 打开当前笔记
             or command palette -> 在学习笔记小窗中打开当前笔记.
          3. Expected:
             - a real Obsidian pop-out Markdown editor opens;
             - default geometry is narrow/tall, roughly a PotPlayer playlist side rail;
             - unnecessary Obsidian ribbon/sidebar/status/tab chrome is hidden;
             - note remains fully editable.
          4. Move and resize it. Close/reopen or use “恢复上次”.
             Expected: geometry restores.
          5. Change scale to 70/80/82/90/100%.
             Expected: only companion-window visual density changes.
          6. Save current layout, then select another layout and return to the saved one.
          7. Keep “锁定为 Capture 目标” enabled.
             Focus PotPlayer or another main-window note, then perform Alt+S capture.
             Expected: capture is written into the locked companion note.
          8. Disable the lock.
             Expected: normal active/remembered note targeting resumes.

          ## Important boundaries
          - This is a real Obsidian Markdown pop-out, not a second private editor.
          - Always-on-top is NOT required in beta.18 MVP.
          - Automatic PotPlayer window docking is NOT included.
          - Full Study Workspace is NOT included.
          - macOS pop-out geometry/editor behavior still requires real-machine acceptance.

          ## Regression
          - Managed and Freeform backlinks from beta.17 must remain functional.
          - Legacy Alt+1..Alt+4 must remain functional.
          - Project Notes / Recent Note must remain functional.
          - HUD must work even when no Companion Note Window is open.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$RELEASE_TAG"             --target "${{ github.sha }}"             --title "Go Study Preview ${PREVIEW_VERSION}"             --notes "beta.18 validation: Companion Note Window MVP plus HUD double-direction, remembered quick-note geometry, stable Freeform labels, and adjacent live template previews. Draft acceptance build; do not merge until real Obsidian testing passes."             --prerelease             "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip"             "dist-preview/go-study-preview/main.js"             "dist-preview/go-study-preview/manifest.json"             "dist-preview/go-study-preview/styles.css"             "dist-preview/go-study-preview/TESTING.md"

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,assets > release.json
          node <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          if (r.tagName !== process.env.RELEASE_TAG || !r.isPrerelease) throw new Error('Release metadata mismatch.');
          const names = new Set(r.assets.map(x => x.name));
          for (const name of [
            'go-study-preview-' + process.env.PREVIEW_VERSION + '.zip',
            'main.js', 'manifest.json', 'styles.css', 'TESTING.md'
          ]) if (!names.has(name)) throw new Error('Missing asset: ' + name);
          NODE

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta18-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta18-preview.yml
          git commit -m "ci: remove one-shot beta.18 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
