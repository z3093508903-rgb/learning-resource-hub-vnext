name: Publish Beta20.3 Preview

on:
  push:
    branches:
      - fix/timeline-parser-beta20-3

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.3
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check
      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.3: timeline parser compatibility hotfix.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'parseTimelineReferenceUri',
            '解析失败',
            'firstParseError',
            'resource-mt7g36x5-dcnnpi7',
            'go-study-floating-timeline'
          ]) if (!packed.includes(marker)) throw new Error('Missing beta20.3 marker: ' + marker);
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.3

          Parser compatibility hotfix for the uploaded 7-link note.

          ## Expected diagnostic on that note
          - 原始链接 7
          - 来源 4
          - 时间点 7
          - 解析失败 0
          - 挂载 1

          If the rail is still invisible but 挂载=1, the remaining issue is purely positioning/CSS.
          If 解析失败 > 0, send the full diagnostic including the first error.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.3 parser hotfix: reproduces the exact 7-link real note, adds a protocol-safe query fallback parser, and exposes parse failures in diagnostics. 331/331 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-3-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-3-preview.yml
          git commit -m "ci: remove one-shot beta20.3 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
