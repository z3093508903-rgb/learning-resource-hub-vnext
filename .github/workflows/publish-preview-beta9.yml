name: Preview Release Runner beta.9

on:
  pull_request:
    branches:
      - preview-release-runner

permissions:
  contents: read

jobs:
  publish-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/go-study-0.3.0-beta.9'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PREVIEW_VERSION: 0.3.0-beta.9
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.9
    steps:
      - name: Checkout preview head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source, build and tests
        run: npm run check && npm run build && npm test

      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Isolated Go Study preview build for settings and native immersive closeout acceptance.';
          fs.writeFileSync(path.join(out, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error(`Expected view type not found: ${oldView}`);
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const previewBundle = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          if (!previewBundle.includes(newView) || previewBundle.includes(oldView)) throw new Error('Preview view isolation failed.');
          for (const required of [
            'videoEnhancementEnabled',
            'videoResumeAfterSave',
            'videoResumeAfterCancel',
            'captureFolder',
            'backupRetention',
            '视频笔记增强已关闭',
            '恢复默认快捷键',
            'Go Study 设置'
          ]) {
            if (!previewBundle.includes(required)) throw new Error(`Settings marker missing: ${required}`);
          }
          if (previewBundle.includes('registerCompanionEventPoller(this)')) throw new Error('Companion event poller must not be mounted in beta.9 runtime.');
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.9

          Settings and native immersive closeout build.

          ## Important
          Keep markdown2potplayer / AutoHotkey fully exited. Beta.9 must remain standalone.

          ## Settings acceptance
          1. Open **Settings → Go Study Preview**. The page title should read **Go Study 设置** and expose workbench, video-note enhancement and data/safety controls.
          2. Video-note enhancement is opt-in. On first use it should be off; with it off, Go Study should not show the immersive status dot and should not own Alt+1..Alt+4.
          3. Enable video-note enhancement. Default Alt+1..Alt+4 should register and the lightweight status dot should appear.
          4. Change one shortcut and reload Obsidian; the binding must persist. A duplicate shortcut must be rejected. Empty input disables that action.
          5. Test Alt+3 and Alt+4 with **resume after save** and **resume after cancel** enabled, then disable each preference and verify the video remains paused for that path.
          6. Change screenshot folder from `GoStudy/Captures` to another safe Vault-relative folder and verify the next Alt+2 / Alt+4 image is created there.
          7. Turn off success feedback and verify successful captures become silent while errors remain visible.
          8. Toggle **auto-collapse Obsidian sidebars** and verify workbench entry respects the choice.
          9. Change backup retention within 3..10 and confirm it persists after restart.
          10. Disable video-note enhancement again and verify all immersive hotkeys are released.

          ## Deferred
          Timestamp/backlink/note-format templates are intentionally deferred to the next Go Study polish stage.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES='Go Study Preview beta.9 closes out the native immersive runtime and introduces a real settings center: opt-in video enhancement, configurable hotkeys, resume behavior, success feedback, capture folder, sidebar behavior and backup retention. The normal runtime no longer mounts the Companion reverse-event poller.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
              "dist-preview/go-study-preview/main.js" \
              "dist-preview/go-study-preview/manifest.json" \
              "dist-preview/go-study-preview/styles.css" \
              "dist-preview/go-study-preview/TESTING.md" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "Go Study Preview ${PREVIEW_VERSION}" \
              --notes "$NOTES" --prerelease \
              "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
              "dist-preview/go-study-preview/main.js" \
              "dist-preview/go-study-preview/manifest.json" \
              "dist-preview/go-study-preview/styles.css" \
              "dist-preview/go-study-preview/TESTING.md"
          fi

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,url,assets > release.json
          node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          if (release.tagName !== process.env.RELEASE_TAG) throw new Error('Release tag mismatch.');
          if (!release.isPrerelease) throw new Error('Release must be prerelease.');
          const names = new Set((release.assets || []).map((asset) => asset.name));
          for (const required of [`go-study-preview-${process.env.PREVIEW_VERSION}.zip`, 'main.js', 'manifest.json', 'styles.css', 'TESTING.md']) {
            if (!names.has(required)) throw new Error(`Missing asset: ${required}`);
          }
          NODE
