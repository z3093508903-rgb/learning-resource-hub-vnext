name: Publish Go Study 0.3.0 RC2

on:
  push:
    branches:
      - release/go-study-0.3.0-rc2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RC_VERSION: 0.3.0-rc.2
      RC_ID: go-study-preview
      RC_NAME: Go Study RC
      RELEASE_TAG: go-study-rc-v0.3.0-rc.2
      BRIDGE_VERSION: 0.1.1
    steps:
      - uses: actions/checkout@v4

      - name: Package RC
        shell: bash
        run: |
          rm -rf dist-rc
          mkdir -p dist-rc/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-rc', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.RC_ID;
          manifest.name = process.env.RC_NAME;
          manifest.version = process.env.RC_VERSION;
          manifest.description = 'Go Study 0.3.0 RC2: selectable backup restore added for final data-safety acceptance.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          for (const marker of [
            'BackupRestoreModal',
            '选择备份恢复',
            '恢复此备份',
            '命名备份（长期保留）',
            'registerGoStudyReferenceProtocol'
          ]) if (!bundle.includes(marker)) throw new Error('Missing RC2 marker: ' + marker);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-rc/go-study-preview/TESTING.md <<'EOF'
          # Go Study 0.3.0 RC2

          ## Backup restore selector
          1. Settings -> Go Study -> 数据与安全.
          2. Click “选择备份恢复”.
          3. Expected: a modal lists:
             - 命名备份（长期保留）
             - 自动恢复快照
          4. Each item shows its file name, size/time metadata, and “恢复此备份”.
          5. Pick a named backup that is NOT the newest backup.
          6. Confirm restore.
          7. Expected:
             - Go Study first creates a before-manual-restore snapshot.
             - The exact selected backup is restored.
             - The selected named backup still exists afterward.
          8. “恢复最近备份” remains as a quick shortcut but is no longer the only restore path.

          All other RC1 acceptance items remain unchanged.
          EOF

          cd dist-rc
          zip -qr "go-study-0.3.0-rc.2.zip" go-study-preview
          cd ..

          cd browser-extension
          zip -qr "../dist-rc/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" bilibili-bridge
          cd ..

      - name: Publish RC prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study 0.3.0 RC2" \
            --notes "RC2 fixes a data-safety UX gap found during real RC acceptance: users can now select and restore any named backup or automatic recovery snapshot instead of only the newest snapshot. Restore still protects the current state first. Full automated validation: 413/413 tests passing." \
            --prerelease \
            "dist-rc/go-study-0.3.0-rc.2.zip" \
            "dist-rc/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" \
            "dist-rc/go-study-preview/main.js" \
            "dist-rc/go-study-preview/manifest.json" \
            "dist-rc/go-study-preview/styles.css" \
            "dist-rc/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-go-study-0.3.0-rc2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-go-study-0.3.0-rc2.yml
          git commit -m "ci: remove one-shot Go Study 0.3.0 RC2 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
