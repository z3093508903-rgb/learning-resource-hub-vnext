name: Publish Beta19A Preview

on:
  push:
    branches:
      - work/study-mode-beta19a

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.19a
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.19a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check

      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.19a: HUD-first Study Mode shell.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'go-study-preview-workbench',
            'go-study-study-mode-drop-target',
            'enterStudyMode',
            'toggle-companion-note-always-on-top',
            'setAlwaysOnTop',
            '右侧小窗',
            '学习模式'
          ]) {
            if (!packed.includes(marker)) throw new Error('Missing beta.19a marker: ' + marker);
          }
          if (packed.includes(oldView)) throw new Error('Preview view isolation failed.');
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.19a

          beta19-A Study Mode shell acceptance build.

          ## Install / upgrade
          1. Keep your existing data.json.
          2. Replace main.js, manifest.json, styles.css in:
             .obsidian/plugins/go-study-preview/
          3. Reload Obsidian.
          4. Confirm Community plugins shows Go Study Preview 0.3.0-beta.19a.

          ## Core beta19-A acceptance
          1. Open a stored video from a Project.
          2. In “开始学习”, confirm clicking a note still uses ordinary study behavior.
          3. Drag a recent/project/search-result note to the detached card at the right:
             拖入 / 右侧小窗 / 学习模式
          4. Expected:
             - real Markdown Companion Window opens on the right;
             - selected note is locked as Capture Target;
             - Companion defaults to always-on-top;
             - video opens after the note window and final focus returns to PotPlayer.
          5. Click PotPlayer and play/pause.
             Expected: Companion remains visible.
          6. Use Alt+S HUD while PotPlayer has focus.
             Expected: capture writes into the locked Companion note.
          7. Use the pin control to disable and re-enable always-on-top.
          8. Close Companion.
             Expected: Study Mode ends, but PotPlayer stays open.
          9. Confirm the Companion native title is only the note name, without Vault / Obsidian suffix.

          ## Explicit beta19-A boundary
          - Player Session / background capture is not included yet.
          - If you click the Companion and give it focus, current HUD may reject capture because PotPlayer is no longer foreground.
          - Switching focus back to PotPlayer returns to the intended HUD-first flow.

          ## Regression
          - Managed/Freeform backlinks
          - Alt+1..Alt+4
          - Alt+S HUD
          - Project Notes / Recent Note
          - ordinary click-to-study flow
          - Companion manual open / restore / layout persistence
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta19-A validation build: drag a selected note into the detached Study Mode card, open the real Markdown Companion on the right, lock Capture, default to always-on-top with a pin toggle, and keep PotPlayer as the HUD-first interaction focus. Draft acceptance build; do not merge until real Obsidian testing passes." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"

      - name: Verify release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,assets > release.json
          node <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          if (r.tagName !== process.env.RELEASE_TAG || !r.isPrerelease) throw new Error('Release metadata mismatch.');
          const names = new Set(r.assets.map(x => x.name));
          for (const name of [
            'go-study-preview-' + process.env.PREVIEW_VERSION + '.zip',
            'main.js', 'manifest.json', 'styles.css', 'TESTING.md'
          ]) if (!names.has(name)) throw new Error('Missing asset: ' + name);
          NODE

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta19a-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta19a-preview.yml
          git commit -m "ci: remove one-shot beta.19a publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
