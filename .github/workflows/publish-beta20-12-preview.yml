name: Publish Beta20.12 Bilibili Web Preview

on:
  push:
    branches:
      - fix/bilibili-web-learning-beta20-12

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.12
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.12
      BRIDGE_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4

      - name: Package preview and browser bridge
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta20.12: Bilibili web HUD timestamps + stable Companion caret.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          for (const marker of [
            'requestBilibiliWebBridge',
            'bilibiliTimestampUrl',
            'scheduleCompanionEditorCursorReveal',
            'B站网页桥接'
          ]) if (!bundle.includes(marker)) throw new Error('Missing beta20.12 marker: ' + marker);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.12

          ## Install Bilibili web bridge (Preview only)
          1. Unzip go-study-bilibili-bridge-0.1.0.zip.
          2. Chrome / Edge -> Extensions -> enable Developer mode.
          3. Choose Load unpacked.
          4. Select the unzipped bilibili-bridge folder.
          5. Keep Go Study Preview enabled in Obsidian.

          ## Test Bilibili web HUD
          1. Completely exit PotPlayer.
          2. Open https://www.bilibili.com/video/... in Chrome/Edge and play it.
          3. Keep that Bilibili tab foreground.
          4. In Obsidian Settings -> Go Study -> 视频笔记增强, B站网页桥接 should show connected.
          5. Lock a Companion note as Capture target, or leave a Markdown editor as the remembered target.
          6. Press Alt+S.
          7. Test:
             - only timestamp
             - pure note
             - comment + timestamp
          8. Timestamp should look like:
             https://www.bilibili.com/video/BV...?p=2&t=69.4
          9. Clicking it should return directly to Bilibili web, not PotPlayer.

          Screenshot HUD actions remain PotPlayer-only in this Preview.

          ## Companion caret stabilization
          1. Open a long Markdown in Companion.
          2. Type continuously near the bottom and move/click the caret while typing.
          3. Expected: no repeated jumping or forced bottom refresh.
          4. Trigger a HUD insertion.
          5. Expected: one reveal of newly inserted content only if the user has not moved the caret afterward.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

          cd browser-extension
          zip -qr "../dist-preview/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" bilibili-bridge
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.12 adds optional Bilibili web learning. A tiny browser bridge reports the foreground Bilibili HTML5 video time to Go Study over loopback only; HUD timestamp, note, and note+timestamp actions can work without PotPlayer, and web-origin timestamps are direct Bilibili t= links. Companion caret reveal is now event-driven and abandons auto-scroll if the user keeps typing or moves the caret. Full validation: 402/402 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-bilibili-bridge-${BRIDGE_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-12-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-12-preview.yml
          git commit -m "ci: remove one-shot beta20.12 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
