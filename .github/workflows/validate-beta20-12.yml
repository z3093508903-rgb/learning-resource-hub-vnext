name: Validate Beta20.12 Bilibili Web Learning

on:
  push:
    branches:
      - fix/bilibili-web-learning-beta20-12

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Full release validation
        run: npm run release:check

      - name: Validate browser extension syntax
        shell: bash
        run: |
          node --check browser-extension/bilibili-bridge/background.js
          node --check browser-extension/bilibili-bridge/content.js
          node -e "const m=require('./browser-extension/bilibili-bridge/manifest.json'); if(m.manifest_version!==3) process.exit(1)"

      - name: Commit generated bundle and remove one-shot validator
        shell: bash
        run: |
          rm .github/workflows/validate-beta20-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/validate-beta20-12.yml
          git commit -m "build: validate beta20.12 Bilibili web learning"
          git push origin HEAD:${GITHUB_REF_NAME}
