name: Freeform Fix Rebuild

on:
  push:
    branches:
      - fix/freeform-jv-reopen-v1

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and validate
        run: npm run release:check

      - name: Remove one-shot workflow
        run: rm .github/workflows/freeform-fix-rebuild.yml

      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/freeform-fix-rebuild.yml
          git commit -m "build: refresh main.js for freeform jv fix"
          git push origin HEAD:${GITHUB_REF_NAME}
