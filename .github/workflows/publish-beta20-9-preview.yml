name: Publish Beta20.9 Preview

on:
  push:
    branches:
      - work/portable-reference-fallback-beta20-9

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.9
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check
      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.9: portable backlinks, light-mode fixes, named backups.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'PORTABLE_MANAGED_REFERENCE_VERSION',
            'chooseReferenceRelinkResource',
            'browserUrlForReference',
            'createNamedStateBackup',
            '重命名最近快照'
          ]) if (!packed.includes(marker)) throw new Error('Missing beta20.9 marker: ' + marker);

          const css = fs.readFileSync(path.join(out, 'styles.css'), 'utf8');
          if (!css.includes('.modal.rh-next-modal')) throw new Error('Missing modal theme scope.');
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.9

          ## A. New timestamp fallback
          1. Add/collect a Bilibili video and generate a new timestamp.
          2. The visible Markdown should still show only the timestamp.
          3. Ctrl-click the timestamp.
          4. Expected: browser opens the Bilibili page at the captured time.
          5. Remove the Resource from the current Go Study library and click the new timestamp again.
          6. Expected: the v3 link can use hidden fallback metadata instead of immediately failing.

          ## B. Legacy v1 broken link
          1. Open an old v1 timestamp whose Resource ID no longer exists.
          2. If recovery snapshots contain the old Resource, Go Study should recover it automatically.
          3. Otherwise, normal-click should offer “重新关联旧时间戳”.
          4. Re-collect the original video, select it once, then retry.
          5. Expected: all timestamps using the same old Resource ID now resolve through the saved alias.
          6. Ctrl-click should also use the aliased Resource web URL.

          ## C. Light mode
          1. Switch Obsidian to light mode.
          2. Open Add / Import / “选择保存位置”.
          3. Expected: primary buttons have visible text and inputs do not become white-on-white.

          ## D. Named backups
          1. Settings → Go Study → 数据与安全.
          2. Create a “新建命名备份”.
          3. Create more than the configured automatic retention count.
          4. Expected: named saved-* backup remains.
          5. Use “重命名最近快照”.
          6. Expected: that snapshot becomes a saved-* long-term backup and is excluded from auto cleanup.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.9 pre-RC hardening: self-describing Managed v3 timestamps, legacy v1 recovery/relink fallback, Managed Ctrl-click browser opening with Bilibili time, light-mode modal contrast fixes, and named backups excluded from auto retention. 367/367 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-9-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-9-preview.yml
          git commit -m "ci: remove one-shot beta20.9 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
