name: Validate Go Study 0.3.0 RC3

on:
  push:
    branches:
      - release/go-study-0.3.0-rc3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        run: npm run release:check
      - name: Commit generated bundle and remove one-shot validator
        shell: bash
        run: |
          rm .github/workflows/validate-go-study-0.3.0-rc3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/validate-go-study-0.3.0-rc3.yml
          git commit -m "build: validate Go Study 0.3.0 RC3"
          git push origin HEAD:${GITHUB_REF_NAME}
