name: Publish Beta20.8 Preview

on:
  push:
    branches:
      - fix/state-safety-native-drag-beta20-8

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.8
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check
      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.8: fail-closed state safety and real recovery backups.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'startupSafetySnapshot',
            'assertSafePersist',
            'go-study-recovery',
            '恢复最近备份',
            '打开备份文件夹',
            '立即备份'
          ]) if (!packed.includes(marker)) throw new Error('Missing beta20.8 marker: ' + marker);
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.8

          Release-blocking data-safety hotfix.

          ## Restart safety
          1. Create at least one project + resource.
          2. Fully close Obsidian.
          3. Reopen Obsidian.
          4. Expected: project/resource data remains.
          5. Repeat restart twice.

          ## Recovery folder
          1. Settings → Go Study → 数据与安全.
          2. Expected: “恢复备份位置” shows:
             <Vault>/.obsidian/go-study-recovery
          3. Click “打开备份文件夹”.
          4. Expected: the folder opens and contains JSON recovery snapshots.

          ## Manual backup / restore
          1. Click “立即备份”.
          2. Change Go Study state (for example add a test project/resource).
          3. Click “恢复最近备份”.
          4. Expected: the previous state returns and current state was also protected before restore.

          ## Fail-closed guard
          If Go Study detects that a populated state is about to become an empty state during startup or save, it must refuse the overwrite and keep the original data.json / recovery snapshot intact.

          ## Regression
          - timestamp-only capsules
          - Timeline Navigator
          - Companion
          - HUD
          - native Obsidian drag bridge from beta20.7
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "Release-blocking data safety hotfix: startup raw data protection, fail-closed persist guard, real rolling recovery snapshots outside the plugin folder, visible backup path, manual backup, and recent restore. 356/356 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-8-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-8-preview.yml
          git commit -m "ci: remove one-shot beta20.8 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
