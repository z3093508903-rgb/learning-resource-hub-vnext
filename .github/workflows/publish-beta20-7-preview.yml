name: Publish Beta20.7 Preview

on:
  push:
    branches:
      - fix/native-drag-companion-cursor-beta20-7

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.7
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full release validation
        env:
          RELEASE_TAG: ''
        run: npm run release:check
      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.7: native Obsidian drag and Companion cursor fix.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));

          const packed = fs.readFileSync(path.join(out, 'main.js'), 'utf8');
          for (const marker of [
            'installNativeObsidianStudyDrag',
            'markdownPathFromTabTarget',
            'is-native-obsidian',
            'pointerCandidate',
            'completeDrop'
          ]) if (!packed.includes(marker)) throw new Error('Missing beta20.7 marker: ' + marker);

          const css = fs.readFileSync(path.join(out, 'styles.css'), 'utf8');
          if (css.includes('zoom: var(--go-study-companion-scale)')) throw new Error('Unsafe Companion CSS zoom still present.');
          if (!css.includes('zoom: 1 !important')) throw new Error('Click-safe Companion zoom reset missing.');
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.7

          ## A. Native Obsidian drag
          1. Keep a loose video already open in PotPlayer.
          2. In Obsidian left file tree, drag any Markdown note.
          3. Expected: right-side “拖入 / 右侧小窗 / 学习模式” target appears.
          4. Drop it there. Expected: Companion opens for that note; PotPlayer does not restart.
          5. Repeat by dragging an already-open Markdown tab.
          6. Expected: same Study Mode target and same behavior.

          ## B. Companion caret
          1. Open a Study Mode Companion note containing multiple lines.
          2. Click near the start, middle, and end of different lines.
          3. Expected: caret follows the mouse location like a normal Obsidian editor.
          4. Click between words and type.
          5. Expected: text inserts at the clicked position, not at a stale/offset cursor.
          6. Scroll and repeat to ensure hit-testing stays aligned.

          ## Regression
          - Go Study workbench project-note drag still shows only one drop target.
          - Alt+S capture still writes into the locked Companion note.
          - Closing Companion still exits Study Mode without closing PotPlayer.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.7 hotfix: native Obsidian file-tree/tab drag into current loose-video Study Mode, plus click-safe Companion editor scaling. 349/349 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"
      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-7-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-7-preview.yml
          git commit -m "ci: remove one-shot beta20.7 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
