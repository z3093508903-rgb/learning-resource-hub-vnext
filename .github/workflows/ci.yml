name: CI

on:
  push:
    branches:
      - main
      - release-hardening
  pull_request:

permissions:
  contents: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/resource-backlinks

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run release checks
        run: npm run release:check

      - name: Sync feature main.js
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/resource-backlinks'
        shell: bash
        run: |
          if git diff --quiet -- main.js; then
            echo "main.js is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "build: sync resource backlinks bundle"
          git push origin HEAD:feature/resource-backlinks

      - name: Verify committed main.js is current
        run: git diff --exit-code -- main.js
