name: Publish Beta20.9.2 Preview

on:
  push:
    branches:
      - fix/legacy-jv-native-beta20-9-2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.9.2
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.9.2
    steps:
      - uses: actions/checkout@v4

      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta.20.9.2: native PotPlayer playback + opt-in legacy JV compatibility + resilient Bilibili Ctrl-click.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          for (const marker of [
            'legacyJvCompatibilityEnabled',
            'parseLegacyJvUri',
            'native-potplayer-cli',
            'launchPotPlayerTarget',
            'browserModifierActive'
          ]) if (!bundle.includes(marker)) throw new Error('Missing beta20.9.2 marker: ' + marker);
          if (bundle.includes('return `jv://open?path=')) throw new Error('New runtime still generates legacy JV playback URLs.');
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.9.2

          Focus: remove note2potplayer runtime dependency while preserving optional legacy JV notes.

          ## New Go Study Bilibili timestamp
          1. Open a Bilibili video in PotPlayer.
          2. Capture a NEW Go Study timestamp.
          3. Ordinary click: expected PotPlayer opens/seeks directly without note2potplayer.exe.
          4. Ctrl-click in normal Obsidian Markdown: expected system browser opens /video/BV...?t=<seconds>.
          5. Repeat Ctrl-click in Companion.

          ## Old jv:// notes
          1. Settings -> Go Study -> 视频笔记增强 -> enable “旧 JV 链接兼容（高级）”.
          2. Stop the old note2potplayer/AutoHotkey helper if it is running.
          3. Ordinary-click an old jv://open?path=...&time=... link inside Obsidian.
          4. Expected: Go Study opens PotPlayer directly at the saved time.
          5. For old Bilibili JV links, Ctrl-click should open the browser at the saved time.

          New users should leave legacy JV compatibility OFF.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.9.2 removes Go Study's runtime generation of jv:// playback URLs, launches PotPlayer natively with /current + /seek, adds an opt-in legacy JV reader for old notes, and adds a protocol-level Ctrl-click browser fallback. Full validation before packaging: 383/383 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-9-2-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-9-2-preview.yml
          git commit -m "ci: remove one-shot beta20.9.2 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
