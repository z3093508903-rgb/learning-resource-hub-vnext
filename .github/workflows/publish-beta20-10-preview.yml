name: Publish Beta20.10 Native Drag Preview

on:
  push:
    branches:
      - fix/native-obsidian-drag-beta20-10

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_VERSION: 0.3.0-beta.20.10
      PREVIEW_ID: go-study-preview
      PREVIEW_NAME: Go Study Preview
      RELEASE_TAG: go-study-preview-v0.3.0-beta.20.10
    steps:
      - uses: actions/checkout@v4

      - name: Package isolated preview
        shell: bash
        run: |
          rm -rf dist-preview
          mkdir -p dist-preview/go-study-preview
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = path.join('dist-preview', 'go-study-preview');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.id = process.env.PREVIEW_ID;
          manifest.name = process.env.PREVIEW_NAME;
          manifest.version = process.env.PREVIEW_VERSION;
          manifest.description = 'Go Study Preview beta20.10: non-invasive native Obsidian Markdown drag bridge diagnostic.';
          fs.writeFileSync(path.join(out, 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');

          let bundle = fs.readFileSync('main.js', 'utf8');
          const oldView = 'learning-resource-hub-next-workbench';
          const newView = 'go-study-preview-workbench';
          if (!bundle.includes(oldView)) throw new Error('Expected workbench view marker not found.');
          bundle = bundle.split(oldView).join(newView);
          for (const marker of [
            'nativeDragDiagnostic',
            'markdownPathFromComposedPath',
            'Go Study native drag diagnostic',
            'is-native-obsidian'
          ]) {
            if (!bundle.includes(marker)) throw new Error('Missing beta20.10 marker: ' + marker);
          }
          if (bundle.includes("doc.addEventListener('pointermove', onPointerMove")) {
            throw new Error('Native drag bridge still installs pointer-move takeover.');
          }
          fs.writeFileSync(path.join(out, 'main.js'), bundle);
          fs.copyFileSync('styles.css', path.join(out, 'styles.css'));
          NODE

          cat > dist-preview/go-study-preview/TESTING.md <<'EOF'
          # Go Study Preview 0.3.0-beta.20.10

          Focus: native Obsidian Markdown drag bridge without hijacking Obsidian's own drag behavior.

          ## Boundary
          - Normal file-tree moves/reorders remain Obsidian-owned.
          - Normal tab reorder remains Obsidian-owned.
          - Go Study only owns the drop after the pointer enters the small “拖入 / 右侧小窗 / 学习模式” target.
          - This build removes the global pointerdown/pointermove fallback from the native bridge.

          ## Test A — file tree
          1. Keep PotPlayer open.
          2. Drag a Markdown file in Obsidian's left file tree.
          3. Expected: Go Study target appears on the right.
          4. Drop somewhere else in Obsidian: normal Obsidian behavior must continue.
          5. Repeat and drop inside the Go Study target: Companion Study Mode should open with that note.

          ## Test B — open Markdown tab
          1. Drag an already-open Markdown tab.
          2. Expected: Go Study target appears.
          3. Reorder/drop the tab normally: Obsidian behavior must not be blocked.
          4. Repeat and drop inside Go Study target: Companion Study Mode should open.

          ## Diagnostic
          If a native drag is detected but the Markdown path cannot be resolved, a Notice says the diagnostic was recorded.
          Open Developer Tools (Ctrl+Shift+I) -> Console and look for:
          "Go Study native drag diagnostic"
          Screenshot or copy that object for the next fix.
          EOF

          cd dist-preview
          zip -qr "go-study-preview-${PREVIEW_VERSION}.zip" go-study-preview
          cd ..

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "${{ github.sha }}" \
            --title "Go Study Preview ${PREVIEW_VERSION}" \
            --notes "beta20.10 introduces a non-invasive native Obsidian Markdown drag bridge. It listens to native dragstart/composedPath/dataTransfer, removes the global pointer fallback, and only prevents the drop inside Go Study's explicit Study Mode target. Full validation: 388/388 tests passing." \
            --prerelease \
            "dist-preview/go-study-preview-${PREVIEW_VERSION}.zip" \
            "dist-preview/go-study-preview/main.js" \
            "dist-preview/go-study-preview/manifest.json" \
            "dist-preview/go-study-preview/styles.css" \
            "dist-preview/go-study-preview/TESTING.md"

      - name: Remove one-shot publisher
        shell: bash
        run: |
          rm .github/workflows/publish-beta20-10-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-beta20-10-preview.yml
          git commit -m "ci: remove one-shot beta20.10 publisher"
          git push origin HEAD:${GITHUB_REF_NAME}
