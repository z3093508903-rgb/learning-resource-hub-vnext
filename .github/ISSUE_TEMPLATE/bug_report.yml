name: Bug report
description: Report a reproducible Go Study problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Go Study. Please avoid attaching private Vault data or credentials.
  - type: input
    id: version
    attributes:
      label: Go Study version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Obsidian version, Windows version, browser/PotPlayer/OpenList versions when relevant.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. ...
2. ...
3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
